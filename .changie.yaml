# Release notes, one file per change (CONTRIBUTING.md "Releases"). A pull
# request adds its file with `npm run changie -- new`; merging it into main
# releases it.
changesDir: .changes
unreleasedDir: unreleased
# Milliseconds: to the second, two files written in the same second share a
# name and the second overwrites the first.
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405.000"}}'
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
body:
  minLength: 3
# The kind sets the version bump, per Semantic Versioning. Changes released
# together take the largest bump among them.
kinds:
  - label: Breaking
    auto: major
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Deprecated
    auto: minor
  - label: Removed
    auto: major
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
newlines:
  beforeChangelogVersion: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 1
