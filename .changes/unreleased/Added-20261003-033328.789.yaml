kind: Added
body: 'Point-in-time recovery. With `snapshots.shipTo` set, the write-ahead log is copied there continuously by Litestream, running inside the server, and the database can be restored to any moment in the last interval × keep: `campfire restore -at "2026-10-03 14:05"`, or `-at latest`. The administration screen shows the span covered and writes the command. `shipTo` no longer receives copies of the scheduled snapshots. Flags may now follow the command: `campfire -config x restore -at latest`.'
time: 2026-10-03T03:33:28.789060735+02:00
