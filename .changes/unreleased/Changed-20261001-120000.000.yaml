kind: Changed
body: Saved views are switches in the sidebar. A click turns one on or off, several can be on at once, and right-clicking a view edits its name, query and pins, or deletes it. In the HTTP API and the MCP tools a saved view takes and returns a `query` in place of `clauses`, and existing views are rewritten as the query they meant; the item list's `view` parameter is and-ed with any other filter instead of replacing it.
