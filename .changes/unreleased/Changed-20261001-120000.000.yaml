kind: Changed
body: Saved views are switches in the sidebar. A click turns one on or off, several can be on at once, and they stack with each other and with the filter bar; values of one filter add up and different filters narrow. Every filter chip now picks several values. A view's filters are named in full, a bucket by its identifier and title rather than its number. Right-clicking a view edits its name, filter and pins, or deletes it.
