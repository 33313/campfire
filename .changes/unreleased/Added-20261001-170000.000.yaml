kind: Added
body: Filters are CSQL, the Campfire Simple Query Language, edited two ways. Filter chips cover the common case without typing; each value cycles between not set, is and isn't, and Created, Started, Completed and Due take day presets or a range. Raw mode takes any query, with and, or, not and parentheses, offers what can come next as you type, and points at a mistake before anything is sent; nothing typed there ever blocks, as Discard puts back the filter in use; `none` is the value of an empty field and days are read in your time zone. Agents pass the same language as `query`, with `tz`. A card that stops matching the filter while on screen goes where it went — into Done, feeding the fire — and stays there, faded, until the filter changes. Suggestions match any part of a value: rev finds In Review. The words a query uses — and, or, not, in, none, me and today — can no longer be a username, label, team or work state name.
