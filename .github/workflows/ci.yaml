name: ci

# Pull requests only. Merging into main is gated on these checks passing on the
# pull request, so running them again on the merge commit tests a tree that has
# already been tested and delays nothing but the next run.
on: pull_request

# A push that supersedes an earlier one cancels it: the older run is testing a
# tree nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The client is a build artefact, so it is not in the repository. Build it
      # first: the binary embeds whatever internal/web/app holds.
      - name: Build the client
        run: npm ci && npm run build

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The browser is the slowest thing this workflow downloads, so it is
      # cached against the Playwright version that asks for it. --with-deps
      # installs system packages and is only needed when the cache misses.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # One binary for both end-to-end steps: they exercise the same tree, and
      # linking it twice is a minute of nothing.
      - name: Build the binary
        run: go build -o ./campfire .

      # The client's own tests drive the real binary in a browser.
      - name: End to end
        run: |
          npx playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
          npx playwright test

      # SPEC.md §13.3 rule 4: the restore path MUST be exercised in continuous
      # integration. A backup that has never been restored is not a backup.
      # The unit tests cover it; this runs it against the real binary too, so
      # the command an operator types is the one that is tested.
      - name: Snapshot and restore, end to end
        run: |
          set -euxo pipefail
          root=$(mktemp -d)
          cat > "$root/campfire.json" <<EOF
          {"addr":"127.0.0.1:8791","database":"$root/campfire.db",
           "snapshots":{"enabled":true,"dir":"$root/snapshots","interval":"1h","keep":3,"shipTo":"$root/offsite"},
           "mcp":{"enabled":false}}
          EOF
          ./campfire -config "$root/campfire.json" &
          server=$!
          for i in $(seq 40); do
            curl -sf http://127.0.0.1:8791/api/instance >/dev/null && break || sleep 0.25
          done

          jar="$root/cookies"
          curl -sf -c "$jar" -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"correct horse battery"}' \
            http://127.0.0.1:8791/api/instance/bootstrap
          curl -sf -b "$jar" -c "$jar" -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"correct horse battery"}' \
            http://127.0.0.1:8791/api/auth/signin
          curl -sf -b "$jar" -H 'Content-Type: application/json' \
            -d '{"name":"Solstice","shortCode":"SOL"}' http://127.0.0.1:8791/api/teams
          curl -sf -b "$jar" -H 'Content-Type: application/json' \
            -d '{"kind":"ticket","teamId":1,"title":"before the snapshot"}' \
            http://127.0.0.1:8791/api/items

          snapshot=$(./campfire -config "$root/campfire.json" snapshot)
          test -f "$snapshot"
          test -f "$root/offsite/$(basename "$snapshot")"

          curl -sf -b "$jar" -H 'Content-Type: application/json' \
            -d '{"kind":"ticket","teamId":1,"title":"after the snapshot"}' \
            http://127.0.0.1:8791/api/items
          kill $server; wait $server || true

          ./campfire -config "$root/campfire.json" restore "$snapshot"
          ./campfire -config "$root/campfire.json" check

          ./campfire -config "$root/campfire.json" &
          server=$!
          for i in $(seq 40); do
            curl -sf http://127.0.0.1:8791/api/instance >/dev/null && break || sleep 0.25
          done
          curl -sf -b "$jar" -c "$jar" -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"correct horse battery"}' \
            http://127.0.0.1:8791/api/auth/signin
          titles=$(curl -sf -b "$jar" 'http://127.0.0.1:8791/api/items?team=1')
          echo "$titles" | grep -q 'before the snapshot'
          if echo "$titles" | grep -q 'after the snapshot'; then
            echo "the restore did not roll the database back"; exit 1
          fi
          kill $server; wait $server || true

  # The image is a packaging concern: it only changes when the things that go
  # into it do. It is not a required check, so a pull request that does not
  # touch them is not waiting on it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Does this change the image?
        id: touched
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --name-only "$base"... | grep -qE '^(Dockerfile|go\.(mod|sum)|package(-lock)?\.json|build\.sh|main\.go|mcp\.go|backup\.go|internal/|api/)'; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the container image
        if: steps.touched.outputs.yes
        run: docker build -t campfire:ci .
