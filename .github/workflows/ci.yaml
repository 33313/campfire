name: ci

# Pull requests only. Merging into main is gated on these checks passing on the
# pull request, so running them again on the merge commit tests a tree that has
# already been tested and delays nothing but the next run.
on: pull_request

# A push that supersedes an earlier one cancels it: the older run is testing a
# tree nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Words and other workflows change nothing the tests can see. A pull request
  # that touches only those skips them; a skipped job still passes as a
  # required check. Anything not listed here is code, so a new kind of file
  # runs the tests until it is added. ci.yaml is code: a change to it is
  # proved by running it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.touched.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: touched
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --name-only "$base"... |
             grep -qvE '(^|/)[^/]*\.md$|^\.changes/|^\.github/workflows/(release|changeset)\.yaml$|^LICENSE$'; then
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The client is a build artefact, so it is not in the repository. Build it
      # first: the binary embeds whatever internal/web/app holds.
      - name: Build the client
        run: npm ci && npm run build

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The client's CSQL parser answers to the same corpus as the server's
      # (SPEC.md §9.2).
      - name: Test the client's parser
        run: npm test

      # Only Linux runs the tests, but a release ships Windows and macOS too.
      # The code differs by operating system, never by architecture, so one
      # type-check per OS finds what would stop the release, at a third of the
      # cost of building all six binaries.
      - name: Compile for Windows and macOS
        run: GOOS=windows go vet ./... && GOOS=darwin GOARCH=arm64 go vet ./...

      # The browser is the slowest thing this workflow downloads, so it is
      # cached against the Playwright version that asks for it. --with-deps
      # installs system packages and is only needed when the cache misses.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # The client's own tests drive the real binary in a browser.
      - name: End to end
        run: |
          npx playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium firefox' || '--with-deps chromium firefox' }}
          npx playwright test

  # The image is a packaging concern: it only changes when the things that go
  # into it do. It is not a required check, so a pull request that does not
  # touch them is not waiting on it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Does this change the image?
        id: touched
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --name-only "$base"... | grep -qE '^(Dockerfile|\.dockerignore|go\.(mod|sum)|package(-lock)?\.json|build\.sh|main\.go|mcp\.go|backup\.go|internal/|api/)'; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the container image
        if: steps.touched.outputs.yes
        run: docker build -t campfire:ci .
